name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Misma imagen jammy que visual/local Docker → menos drift de Chromium/Node.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run check
      - run: npm run audit:i18n
      - run: npm test

  visual:
    # Misma imagen que el update local (comentario en tests/visual.spec.js).
    # ubuntu-latest (24.04) pinta fuentes distinto y rompe los *-linux.png.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:visual
